<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperTV WebUI</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #121212;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            text-align: center;
            padding: 48px 64px;
            border-radius: 16px;
            background: #1e1e1e;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 { margin: 0 0 12px; font-size: 32px; }
        p { margin: 0; color: #9e9e9e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>HyperTV WebUI</h1>
        <p>占位页 — 直播源管理界面将在后续版本提供</p>
    </div>
</body>
</html>
